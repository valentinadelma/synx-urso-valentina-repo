[build]
  command = "vite build && node scripts/postbuild.mjs"
  publish = "dist/client"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "vite dev"
  port = 3000

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
